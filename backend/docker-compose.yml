services:
  postgres:
    image: postgres:16-alpine
    container_name: shell_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shell
      POSTGRES_PASSWORD: shell_password
      POSTGRES_DB: shell_db
    ports:
      - "5432:5432"
    volumes:
      - shell_pgdata:/var/lib/postgresql/data

volumes:
  shell_pgdata:
