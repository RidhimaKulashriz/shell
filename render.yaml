services:
  - type: web
    name: shell-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_VERSION
        value: 0.1.0
      - key: APP_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SAMESITE
        value: none
      - key: SHOW_DEMO_DATA
        value: "false"
      - key: OTP_PROVIDER
        value: mock
      - key: PLAN_LLM_PROVIDER
        value: keyword
      - key: MAP_PROVIDER
        value: svg
      - key: STT_PROVIDER
        value: browser
      - key: KYC_PROVIDER
        value: mock
      - key: TELEPHONY_PROVIDER
        value: mock
      - key: DATABASE_URL
        fromDatabase:
          name: shell-db
          property: connectionString

databases:
  - name: shell-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: shell
    user: shell
